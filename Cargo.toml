[package]
name = "ferrisfetch"
version = "0.9.9"
edition = "2021"
rust-version = "1.75.0"
description = "A fast, lightweight Linux, macOS, and Windows system information fetch tool written in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/kk376/ferrisfetch"
homepage = "https://github.com/kk376/ferrisfetch"
documentation = "https://docs.rs/ferrisfetch"
keywords = ["fetch", "system-info", "linux", "windows", "cli"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "completions/**/*",
    "tests/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[dependencies]
clap = { version = "~4.5.31", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "~2.0.14"
clap_complete = "~4.5.31"
predicates = "~3.1.0"
tempfile = "=3.10.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ferrisfetch", dest = "/usr/bin/ferrisfetch", mode = "755" },
    { source = "completions/ferrisfetch.bash", dest = "/usr/share/bash-completion/completions/ferrisfetch", mode = "644" },
    { source = "completions/_ferrisfetch", dest = "/usr/share/zsh/site-functions/_ferrisfetch", mode = "644" },
    { source = "completions/ferrisfetch.fish", dest = "/usr/share/fish/vendor_completions.d/ferrisfetch.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ferrisfetch/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/ferrisfetch/LICENSE", mode = "644" },
]

[package.metadata.deb]
maintainer = "FerrisFetch Packaging Team <packaging@ferrisfetch.rs>"
copyright = "2026 FerrisFetch Authors"
license-file = ["LICENSE", "4"]
extended-description = "A fast, lightweight Linux system information fetch tool written in Rust."
section = "utils"
priority = "optional"
assets = [
    ["target/release/ferrisfetch", "usr/bin/ferrisfetch", "755"],
    ["completions/ferrisfetch.bash", "usr/share/bash-completion/completions/ferrisfetch", "644"],
    ["completions/_ferrisfetch", "usr/share/zsh/vendor-completions/_ferrisfetch", "644"],
    ["completions/ferrisfetch.fish", "usr/share/fish/vendor_completions.d/ferrisfetch.fish", "644"],
    ["README.md", "usr/share/doc/ferrisfetch/README.md", "644"],
    ["LICENSE", "usr/share/licenses/ferrisfetch/LICENSE", "644"],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }"
bin-dir = "{ name }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-aarch64"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



