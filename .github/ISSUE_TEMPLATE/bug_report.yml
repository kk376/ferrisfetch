name: Bug Report
description: File a bug report to help fix an issue in KKFetch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the details below to help us reproduce and resolve the issue.
  - type: input
    id: version
    attributes:
      label: KKFetch Version
      description: Run `kkfetch --version` and paste the output.
      placeholder: kkfetch 0.11.7
    validations:
      required: true
  - type: input
    id: os_info
    attributes:
      label: Linux Distribution and Kernel
      description: Your Linux distribution and kernel version.
      placeholder: Ubuntu 24.04, 6.8.0-31-generic
    validations:
      required: true
  - type: input
    id: env_info
    attributes:
      label: Desktop / Window Manager and Terminal
      description: Your session type (Wayland or X11), desktop/WM, and terminal emulator.
      placeholder: Wayland + Sway, Alacritty, zsh
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command Executed
      description: The exact command line invoked.
      placeholder: kkfetch --logo arch
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed Behavior
      description: What happened? Include terminal output or error messages.
      placeholder: Describe the actual output or behavior...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
      placeholder: Describe the expected output...
    validations:
      required: true
  - type: textarea
    id: proc_sys_dumps
    attributes:
      label: Relevant System Files (Optional)
      description: For hardware or OS detection issues, paste relevant snippets from `/proc/cpuinfo`, `/proc/meminfo`, `/etc/os-release`, or sysfs paths.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this issue reproduces with the latest version.
          required: true
        - label: I searched open and closed issues and confirmed this is not a duplicate.
          required: true
